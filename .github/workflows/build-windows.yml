name: Build Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/YunoHub.Desktop/YunoHub.Desktop.csproj

      - name: Publish self-contained x64
        run: dotnet publish src/YunoHub.Desktop/YunoHub.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: YunoHub-Windows-x64
          path: artifacts/win-x64/**
          if-no-files-found: error
          retention-days: 14
